/* =====================================================
   تغيير اللغة
===================================================== */

function setLanguage(language){

    stopSpeech();

    currentLanguage = language;

    document.documentElement.lang = language;

    document.body.style.direction =
        language === "ar" ? "rtl" : "ltr";

    document.getElementById("title").innerText =
        data[language].title;

    document.getElementById("subtitle").innerText =
        data[language].subtitle;

    document.getElementById("introButton").innerText =
        data[language].introButton;

    document.getElementById("listenButton").innerText =
        data[language].listenButton;

    document.getElementById("questionsButton").innerText =
        data[language].questionsButton;

    document.getElementById("stopButton").innerText =
        data[language].stopButton;

    document.getElementById("questionsTitle").innerText =
        data[language].questionsTitle;

    document.getElementById("question").innerText = "";

    document.getElementById("answer").innerText = "";

    document.getElementById("status").innerText = "";

    updateQuestions();

}


/* =====================================================
   تحديث قائمة الأسئلة
===================================================== */

function updateQuestions(){

    const list =
        document.getElementById("questionsList");

    list.innerHTML = "";

    data[currentLanguage].questions.forEach(function(question){

        const li =
            document.createElement("li");

        li.innerText = question;

        list.appendChild(li);

    });

}


/* =====================================================
   عرض الأسئلة
===================================================== */

function showQuestions(){

    const box =
        document.getElementById("availableQuestions");

    if(box.style.display === "none" ||
       box.style.display === ""){

        box.style.display = "block";

    }else{

        box.style.display = "none";

    }

}


/* =====================================================
   الجولة التعليمية
===================================================== */

function startIntro(){

    stopSpeech();

    const intro =
        data[currentLanguage].intro;

    document.getElementById("answer").innerText =
        intro;

    speak(intro);

}


/* =====================================================
   التعرف على الصوت
===================================================== */

function startListening(){

    stopSpeech();

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(data[currentLanguage].unsupported);

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        currentLanguage === "ar"
        ? "ar-EG"
        : "en-US";

    recognition.interimResults = false;

    recognition.maxAlternatives = 3;

    recognition.start();


    document.getElementById("question").innerText =
        data[currentLanguage].listening;


    recognition.onresult = function(event){

        const question =
            event.results[0][0].transcript
            .toLowerCase()
            .trim();


        document.getElementById("question").innerText =
            "❓ " + question;


        const answer =
            getAnswer(question);


        document.getElementById("answer").innerText =
            "🤖 " + answer;


        speak(answer);

    };


    recognition.onerror = function(){

        document.getElementById("status").innerText =
            data[currentLanguage].error;

    };

}


/* =====================================================
   تنظيف السؤال
===================================================== */

function cleanQuestion(question){

    return question
        .replace(/[؟?!.,،]/g,"")
        .replace(/\s+/g," ")
        .trim();

}


/* =====================================================
   الحصول على الإجابة
===================================================== */

function getAnswer(question){

    question =
        cleanQuestion(question);


    if(currentLanguage === "en"){

        return getEnglishAnswer(question);

    }

    return getArabicAnswer(question);

}

/* =====================================================
   تحويل النص إلى صوت
===================================================== */

function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        currentLanguage === "ar"
        ? "ar-EG"
        : "en-US";


    speech.rate = 0.9;

    speech.pitch = 1;

    speech.volume = 1;


    function speakNow(){

        const voices =
            speechSynthesis.getVoices();


        let preferredVoice;


        if(currentLanguage === "ar"){

            preferredVoice =
                voices.find(function(voice){

                    return voice.lang &&
                    voice.lang
                    .toLowerCase()
                    .startsWith("ar");

                });

        }else{

            preferredVoice =
                voices.find(function(voice){

                    return voice.lang &&
                    voice.lang
                    .toLowerCase()
                    .startsWith("en");

                });

        }


        if(preferredVoice){

            speech.voice =
                preferredVoice;

        }


        speechSynthesis.speak(speech);

    }


    const voices =
        speechSynthesis.getVoices();


    if(voices.length === 0){

        speechSynthesis.onvoiceschanged =
            function(){

                speechSynthesis.onvoiceschanged = null;

                speakNow();

            };

    }else{

        speakNow();

    }

}


/* =====================================================
   إيقاف الصوت
===================================================== */

function stopSpeech(){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

    }

}
